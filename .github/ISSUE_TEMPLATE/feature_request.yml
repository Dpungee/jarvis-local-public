name: Feature request
description: Propose a measurable capability or usability improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: How should the result be tested or demonstrated?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety and privacy boundaries
      description: Identify any files, accounts, desktop actions, or external effects involved.
