name: Test suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret and privacy scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check public-release privacy boundary
        env:
          PUBLIC_RELEASE_HISTORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_public_release.py --history-ref "$PUBLIC_RELEASE_HISTORY_REF"

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Jarvis
        run: python -m pip install --disable-pip-version-check -e ".[documents]"

      - name: Prepare stable test workspace
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\jarvis-test-${{ matrix.python-version }}" | Out-Null

      - name: Run deterministic tests
        env:
          JARVIS_CLOUD_ENABLED: "false"
          JARVIS_OLLAMA_ENABLED: "false"
          JARVIS_EXTERNAL_ACCESS: disabled
          JARVIS_EXECUTION_MODE: disabled
          JARVIS_COMPUTER_ACCESS: disabled
          TEMP: ${{ runner.temp }}\jarvis-test-${{ matrix.python-version }}
          TMP: ${{ runner.temp }}\jarvis-test-${{ matrix.python-version }}
        run: python -m unittest discover -s tests
