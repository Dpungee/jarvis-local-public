name: Test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret and privacy scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check public-release privacy boundary
        env:
          PUBLIC_RELEASE_HISTORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_RELEASE_HISTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
            PUBLIC_RELEASE_HISTORY_BASE="$(git rev-parse "${PUBLIC_RELEASE_HISTORY_REF}^")"
          fi
          [[ "$PUBLIC_RELEASE_HISTORY_BASE" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ ! "$PUBLIC_RELEASE_HISTORY_BASE" =~ ^0+$ ]] || exit 1
          python scripts/check_public_release.py --history-ref "$PUBLIC_RELEASE_HISTORY_REF" --history-base "$PUBLIC_RELEASE_HISTORY_BASE"

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Jarvis
        run: python -m pip install --disable-pip-version-check -e ".[documents]"

      - name: Prepare stable test workspace
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\jarvis-test-${{ matrix.python-version }}" | Out-Null

      - name: Run deterministic tests
        env:
          JARVIS_CLOUD_ENABLED: "false"
          JARVIS_OLLAMA_ENABLED: "false"
          JARVIS_EXTERNAL_ACCESS: disabled
          JARVIS_EXECUTION_MODE: disabled
          JARVIS_COMPUTER_ACCESS: disabled
          TEMP: ${{ runner.temp }}\jarvis-test-${{ matrix.python-version }}
          TMP: ${{ runner.temp }}\jarvis-test-${{ matrix.python-version }}
        run: python -m unittest discover -s tests

  quality:
    name: Coverage, browser syntax, and distribution
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install quality tooling and Jarvis
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip>=26.2"
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed with exit code $LASTEXITCODE" }
          python -m pip install --disable-pip-version-check coverage build pip-audit ruff bandit
          if ($LASTEXITCODE -ne 0) { throw "Quality-tool installation failed with exit code $LASTEXITCODE" }
          python -m pip install --disable-pip-version-check -e ".[documents]"
          if ($LASTEXITCODE -ne 0) { throw "Jarvis installation failed with exit code $LASTEXITCODE" }

      - name: Check Presence JavaScript syntax
        run: node --check jarvis/presence.js

      - name: Run static correctness and high-severity security checks
        shell: pwsh
        run: |
          python -m ruff check jarvis scripts tests --select E9,F63,F7,F82,F401,F841,B023,B033,PERF102,B018
          if ($LASTEXITCODE -ne 0) { throw "Ruff failed with exit code $LASTEXITCODE" }
          python -m bandit -q -r jarvis scripts -lll
          if ($LASTEXITCODE -ne 0) { throw "Bandit failed with exit code $LASTEXITCODE" }

      - name: Prepare stable test workspace
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\jarvis-quality" | Out-Null

      - name: Run branch-aware source coverage
        shell: pwsh
        env:
          JARVIS_CLOUD_ENABLED: "false"
          JARVIS_OLLAMA_ENABLED: "false"
          JARVIS_EXTERNAL_ACCESS: disabled
          JARVIS_EXECUTION_MODE: disabled
          JARVIS_COMPUTER_ACCESS: disabled
          TEMP: ${{ runner.temp }}\jarvis-quality
          TMP: ${{ runner.temp }}\jarvis-quality
        run: |
          coverage run --branch --source=jarvis,scripts -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw "Coverage test run failed with exit code $LASTEXITCODE" }
          coverage report --fail-under=75
          if ($LASTEXITCODE -ne 0) { throw "Coverage threshold failed with exit code $LASTEXITCODE" }

      - name: Build source and wheel distributions
        shell: pwsh
        run: |
          $sourceEpoch = (git log -1 --pretty=%ct).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceEpoch -notmatch '^\d+$') { throw "Could not derive a valid source epoch" }
          $env:SOURCE_DATE_EPOCH = $sourceEpoch
          python -m build
          if ($LASTEXITCODE -ne 0) { throw "Distribution build failed with exit code $LASTEXITCODE" }

      - name: Smoke-test the built wheel outside the source tree
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1).FullName
          if (-not $wheel) { throw "Built wheel was not found" }
          $smoke = Join-Path $env:RUNNER_TEMP "jarvis-wheel-smoke"
          $outside = Join-Path $env:RUNNER_TEMP "jarvis-wheel-outside"
          $data = Join-Path $env:RUNNER_TEMP "jarvis-wheel-data"
          python -m venv $smoke
          if ($LASTEXITCODE -ne 0) { throw "Smoke virtual environment creation failed with exit code $LASTEXITCODE" }
          $python = Join-Path $smoke "Scripts\python.exe"
          $scripts = Join-Path $smoke "Scripts"
          & $python -m pip install --disable-pip-version-check $wheel
          if ($LASTEXITCODE -ne 0) { throw "Wheel installation failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path $outside, $data | Out-Null
          Push-Location $outside
          try {
            $env:JARVIS_DATA = $data
            & $python -c "import importlib.metadata as m; eps={e.name:e for e in m.entry_points(group='console_scripts') if e.dist and e.dist.name=='jarvis-local'}; expected={'jarvis','jarvis-ui','jarvis-presence','jarvis-public-presence'}; assert expected <= set(eps); [eps[name].load() for name in sorted(expected)]"
            if ($LASTEXITCODE -ne 0) { throw "Installed entry-point import smoke test failed with exit code $LASTEXITCODE" }
            & $python -c "import importlib.metadata as m; from importlib.resources import files; from jarvis.long_horizon import LongHorizonStore; reqs=m.requires('jarvis-local') or []; assert any(r.lower().startswith('cryptography') for r in reqs); fixture=files('jarvis').joinpath('evaluation_fixtures/long_horizon_restart_holdout_v1.json'); assert fixture.is_file(); assert LongHorizonStore is not None"
            if ($LASTEXITCODE -ne 0) { throw "Installed Phase 5 runtime/fixture smoke test failed with exit code $LASTEXITCODE" }
            & (Join-Path $scripts "jarvis.exe") --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "jarvis --help failed with exit code $LASTEXITCODE" }
            & (Join-Path $scripts "jarvis.exe") workflow --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "jarvis workflow --help failed with exit code $LASTEXITCODE" }
            & (Join-Path $scripts "jarvis-public-presence.exe") health | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "jarvis-public-presence health failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Audit installed project dependencies
        run: python -m pip_audit --local --progress-spinner off
